<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Referral decision</title>
    <style>
        html, body { margin: 0; padding: 0; background: #faf9f8; color: #201f1e; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; }
        .dialog { padding: 20px 24px; max-width: 560px; }
        .title { font-size: 20px; font-weight: 600; margin: 0 0 12px; }
        .context { background: #fff; border: 1px solid #e1dfdd; border-radius: 4px; padding: 10px 12px; margin-bottom: 12px; }
        .context-main { font-weight: 600; }
        .context-sub { color: #605e5c; margin-top: 2px; }
        .consequence { color: #605e5c; margin: 0 0 16px; }
        .label { display: block; font-weight: 600; margin-bottom: 4px; }
        .comment { width: 100%; box-sizing: border-box; padding: 8px; font: inherit; border: 1px solid #8a8886; border-radius: 4px; resize: vertical; }
        .comment[aria-invalid="true"] { border-color: #a4262c; }
        .message { margin-top: 10px; color: #323130; }
        .message.error { color: #a4262c; }
        .message.success { color: #107c10; }
        .code { color: #605e5c; font-size: 12px; }
        .buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
        button { font: inherit; padding: 6px 18px; border-radius: 4px; cursor: pointer; border: 1px solid #8a8886; background: #fff; }
        button.primary { background: #0f6cbd; border-color: #0f6cbd; color: #fff; }
        button:disabled { opacity: 0.55; cursor: default; }
        .fatal { padding: 24px; color: #a4262c; }
    </style>
</head>
<body>
    <div id="root"><div class="dialog">Loading…</div></div>
    <script src="slcrm_referraldecision.js?v=1.0.0.9"></script>
</body>
</html>
