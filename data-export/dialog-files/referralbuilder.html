<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create referral</title>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; background: #faf9f8; }
        /* The app sizes itself to its container, so the container must be the viewport. */
        #root { height: 100%; }
        /* Shown until the bundle boots; React replaces it on first render. */
        .boot {
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #605e5c;
            padding: 48px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="root"><div class="boot">Loading referral builder…</div></div>
    <!--
        No inline script: all logic lives in the bundle web resource so the page
        stays within the platform's content-security policy.
    -->
    <script src="slcrm_referralbuilder.js"></script>
</body>
</html>
